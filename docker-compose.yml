services:
  opencleancode:
    # imagem local congelada: nao use :latest aqui, senao um pull muda a versao
    image: opencleancode:7.5.20
    container_name: opencleancode
    ports:
      - "3003:3003"
    volumes:
      - opencleancode:/opencleancode
      - ./local_repos:/opencleancode/local_clones
    environment:
      CODESCENE_IN_DOCKER: "true"
      CODESCENE_DB_PATH: /opencleancode/opencleancode
      CODESCENE_ANALYSIS_RESULTS_ROOT: /opencleancode/analysis
      CODESCENE_CLONED_REPOSITORIES_ROOT: /opencleancode/repos
      CODESCENE_CODE_COVERAGE_DATA_DIR: /opencleancode/code-coverage-data
      DIAGNOSTICS_DIR: /opencleancode/diagnostics
      CODESCENE_TIMEZONE: UTC
      HOST_CLONED_REPOSITORIES_ROOT: /opencleancode/local_clones
      LOCAL_CLONED_REPOSITORIES_ROOT: /opencleancode/local_clones
    restart: unless-stopped

volumes:
  opencleancode:
